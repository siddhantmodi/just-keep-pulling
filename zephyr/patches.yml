# SPDX-License-Identifier: Apache-2.0
#
# Patches to west projects, applied by west_setup.sh with "west patch apply"
# (schema: zephyr/scripts/schemas/patch-schema.yml). Each is meant to go
# upstream; drop it once the NCS version we use includes it. "module" is the
# project's path in the workspace (dependencies live in deps/).
#
# After editing a patch: update its sha256sum (sha256sum <file>).

patches:
  - path: zephyr/0001-drivers-sensor-lsm6dsl-add-motion-trigger.patch
    sha256sum: 19f40f519664b5e072b27a0279ca00753b214264bd429bd04d5c90def678d96d
    module: deps/zephyr
    author: Siddhant Modi
    email: siddhant.modi@gmail.com
    date: 2026-10-31
    upstreamable: true
    comments: |
      SENSOR_TRIG_MOTION (the chip's wake-up interrupt) for the LSM6DSL
      driver, which also runs the XIAO nRF54LM20A's LSM6DS3TR-C, plus an
      emulator and a test. app_main uses it for inactivity sleep and
      wake-on-motion. To submit as a Zephyr PR, after a Signed-off-by.
  - path: zephyr/0002-boards-seeed-xiao_nrf54lm20a-commit-rram-write-buffer.patch
    sha256sum: cd329a4e5e7da2db0fd472caa9181b4552097b90cf06e21877348baffc69bfab
    module: deps/zephyr
    author: Siddhant Modi
    email: siddhant.modi@gmail.com
    date: 2026-11-08
    upstreamable: false
    comments: |
      The XIAO nRF54LM20A's OpenOCD load left the image's last RRAM line
      unprogrammed. Backport of Zephyr ca77b788f93a; drop once NCS's
      Zephyr includes it.
