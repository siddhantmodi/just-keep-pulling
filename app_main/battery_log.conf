# Battery tests, on top of debug.conf: -DEXTRA_CONF_FILE="debug.conf;battery_log.conf"
# Every 5 s reading is logged (for scripts/battery_log.py), and the device never
# sleeps when idle.
CONFIG_APP_POWER_MANAGER_LOG_LEVEL_DBG=y
CONFIG_APP_POWER_MANAGER_IDLE_TIMEOUT_S=86400
CONFIG_APP_POWER_MANAGER_CONNECTED_IDLE_TIMEOUT_S=86400
