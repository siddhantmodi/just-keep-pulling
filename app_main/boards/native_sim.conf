# The emulated ADS1220 (SPI emulator bus).
CONFIG_EMUL=y

# The default 100 Hz tick is too coarse to emulate 1000 conversions/s.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000

# Bumble's virtual controller does not support host-to-controller ACL flow control.
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n

# Nor the PHY update procedure: the controller never answers, which the host treats as fatal.
CONFIG_BT_AUTO_PHY_PERIPHERAL_NONE=y

# Hardware revision in the Device Information service.
CONFIG_BT_DIS_HW_REV_STR="native_sim"
