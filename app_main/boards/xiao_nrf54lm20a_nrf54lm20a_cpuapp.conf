# nPM1300 PMIC: the charger driver is a sensor driver, and configures charging at boot.
CONFIG_SENSOR=y

# SENSOR also enables Zephyr's die temperature driver by default. Not used here.
CONFIG_TEMP_NRF5=n

# +9 dBm, as Crimpdeq: its measurements showed higher power coupling into the
# ADC as single-sample spikes (+20 dBm up to 1.4 kg, +9 dBm up to 0.12 kg, 0 dBm
# within the noise). Revisit once measured on this board.
CONFIG_BT_CTLR_TX_PWR_ANTENNA=9
