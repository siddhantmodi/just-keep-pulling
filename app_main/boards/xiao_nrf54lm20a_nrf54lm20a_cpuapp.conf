# SENSOR (for the PMIC's charger) also enables Zephyr's die temperature driver by default. Not used here.
CONFIG_TEMP_NRF5=n

# +9 dBm, as Crimpdeq: its measurements showed higher power coupling into the
# ADC as single-sample spikes (+20 dBm up to 1.4 kg, +9 dBm up to 0.12 kg, 0 dBm
# within the noise). Revisit once measured on this board.
CONFIG_BT_CTLR_TX_PWR_ANTENNA=9

# As Seeed's board: the nPM1300 regulators start after the charger (sensor
# init, 90), which raises the USB current limit from 100 mA. LDO1's inrush
# would otherwise trip the PMIC on USB power and the board would reset in a loop.
CONFIG_REGULATOR_NPM13XX_COMMON_INIT_PRIORITY=91
CONFIG_REGULATOR_NPM13XX_INIT_PRIORITY=92

# Idle sleep: System OFF, woken by the IMU's motion interrupt.
CONFIG_POWEROFF=y

# Hardware revision in the Device Information service.
CONFIG_BT_DIS_HW_REV_STR="XIAO nRF54LM20A"
