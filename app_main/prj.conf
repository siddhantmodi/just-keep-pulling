# C++23 without exceptions or RTTI. Full libstdc++ provides <expected>, <span>, ...
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

CONFIG_LOG=y

# Settings (calibration, sample rate, device ID) in the storage partition. ZMS
# suits RRAM, which needs no erase.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y

# Seeds the random number generator (the device ID on first boot).
CONFIG_ENTROPY_GENERATOR=y

CONFIG_ZBUS=y

# The nPM1300 PMIC: its charger is a sensor driver (and configures charging at
# boot); ship mode goes through the regulator API.
CONFIG_SENSOR=y
CONFIG_REGULATOR=y

# Bluetooth LE peripheral, one connection, open (unpaired) GATT access, as a
# Tindeq Progressor. The name is set at boot from the device ID.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME="Progressor"

# Throughput for 1000 samples/s: up to 30 samples per notification (ATT MTU
# 247 in one 251-byte link-layer packet), on the 2M PHY. The stack asks for the
# longer packets and the 2M PHY on connection; the client exchanges the MTU.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
# More than ACL TX buffers: the controller can report each one completed separately.
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_AUTO_PHY_PERIPHERAL_2M=y

# Connection parameters once connected, as Crimpdeq when not measuring: 30-50 ms,
# latency 4, 4 s timeout. The stack requests them 5 s after connecting; the
# measurement manager asks for 15 ms while streaming.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Name shown in the NCS boot banner
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="app_main"

# Application components
CONFIG_APP_IDENTITY_SVC=y
CONFIG_APP_LOAD_CELL_SVC=y
CONFIG_APP_BLE_SVC=y
CONFIG_APP_PMIC_SVC=y
CONFIG_APP_MEASUREMENT_MANAGER=y
CONFIG_APP_POWER_MANAGER=y
