# C++23 without exceptions or RTTI. Full libstdc++ provides <expected>, <span>, ...
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

CONFIG_LOG=y

# Settings (calibration, sample rate, device ID) in the storage partition. ZMS
# suits RRAM, which needs no erase.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y

# Seeds the random number generator (the device ID on first boot).
CONFIG_ENTROPY_GENERATOR=y

# Name shown in the NCS boot banner
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="app_main"

# Application components
CONFIG_APP_IDENTITY_SVC=y
CONFIG_APP_LOAD_CELL_SVC=y
