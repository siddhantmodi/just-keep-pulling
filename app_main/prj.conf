# C++23 without exceptions or RTTI. Full libstdc++ provides <expected>, <span>, ...
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

CONFIG_LOG=y
CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_ZBUS=y

# Bluetooth LE peripheral, one connection, open (unpaired) GATT access
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Just Keep Pulling"
CONFIG_BT_MAX_CONN=1

# Application components
CONFIG_APP_LED_SVC=y
CONFIG_APP_TEMP_SVC=y
CONFIG_APP_MANAGER=y
CONFIG_APP_BLE_SVC=y

# Name shown in the NCS boot banner
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="app_main"
