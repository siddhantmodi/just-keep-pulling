# Debug build: west build ... -- -DEXTRA_CONF_FILE=debug.conf
# Adds the shell (on the console UART) with the "jkp" debug commands. The
# default build, without this file, is the release build: no shell.
CONFIG_SHELL=y
CONFIG_ASSERT=y

# The shell prints log messages itself; the console log backends would print each twice.
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_NATIVE_POSIX=n
