# SPDX-License-Identifier: Apache-2.0
name: Set up west workspace
description: >
  Restore cached west dependencies and run west_setup.sh. The repo is checked
  out at the job workspace, so its parent directory is the west topdir and
  dependencies land in ../deps (same layout as the devcontainer).

runs:
  using: composite
  steps:
    - name: Trust the checkout
      shell: bash
      run: git config --global --add safe.directory '*'

    - name: Cache west dependencies
      uses: actions/cache@v5
      with:
        path: |
          ../deps
          ../.west
        key: west-${{ hashFiles('west.yml') }}
        restore-keys: west-

    - name: Initialize and update west workspace
      shell: bash
      run: ./west_setup.sh
