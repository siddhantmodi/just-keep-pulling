# GoogleTest unit test of the Zephyr HAL implementations against native_sim's
# emulated peripherals (gpio_emul, the repo's temperature and ADS1220 emulators).
CONFIG_GTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

CONFIG_ASSERT=y
CONFIG_BOOT_BANNER=n

CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_SPI=y
CONFIG_EMUL=y

# native_sim's default 100 Hz tick is too coarse to emulate 1000 conversions/s.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000

# gtest/gmock need more stack and heap than Zephyr's defaults.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_HEAP_MEM_POOL_SIZE=131072
